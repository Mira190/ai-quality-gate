name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests (unit, integration, end to end)
        run: npm test

  # The gate reviews its own repository: its requirements are in docs/requirements.md and its tests name them.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./
        with:
          # optional: without the secret the gate runs on code-decided findings alone
          copilot-token: ${{ secrets.COPILOT_PAT }}
          enforce: 'true'
