# AI quality gate: a full review of the repository, run on every pull request (and on a schedule, or by hand).
#   1. Is every requirement and design decision proven by a test?
#   2. Is each thing tested at the right level (unit, component, integration, end to end)?
#   3. Does CI enforce its checks (tests, lint, type check ...) on pull requests?
#
#   - uses: actions/checkout@v4
#   - uses: Mira190/ai-quality-gate@v1
#     with:
#       copilot-token: ${{ secrets.COPILOT_PAT }}   # fine-grained token, "Copilot Requests" permission; optional
#
# Code decides everything it can. The model (GitHub Copilot CLI) is asked only whether specific tests prove specific
# rules, and its answers are checked by code. Without a token the gate still runs, on code-decided findings alone.
# What blocks: a P0 or P1 finding anywhere in the repository, with code-decided or code-verified evidence.
# new-only: 'true' turns that into a ratchet for a repository that starts with debt: everything is reported, and
# only findings missing from the default branch's baseline block.
name: AI quality gate
description: Are requirements proven by tests, are tests at the right level, does CI enforce its checks. Deterministic first, the model last.
author: Mira190
branding:
  icon: shield
  color: green

inputs:
  copilot-token:
    description: Fine-grained personal access token with the "Copilot Requests" permission. Empty runs without a model.
    required: false
    default: ''
  model:
    description: Model for the Copilot CLI (empty uses its default).
    required: false
    default: ''
  copilot-version:
    description: Version of @github/copilot to install.
    required: false
    default: latest
  provider:
    description: auto (Copilot when a token is given, else none), copilot, command, handoff or none.
    required: false
    default: auto
  config:
    description: Path of the gate config.
    required: false
    default: .quality-gate.yml
  fail-on:
    description: Lowest priority that fails the check (P0, P1, P2, P3, never). Overrides the config.
    required: false
    default: ''
  new-only:
    description: "'true': a ratchet. Only findings that are not in the default branch's baseline block; all are reported."
    required: false
    default: 'false'
  enforce:
    description: "'true' fails the step when the gate fails. 'false' reports only (use it for the first weeks)."
    required: false
    default: 'true'
  comment:
    description: "'true' posts or updates one pull-request comment (needs pull-requests: write)."
    required: false
    default: 'true'
  sarif:
    description: "'true' uploads findings to code scanning (needs security-events: write)."
    required: false
    default: 'false'
  max-requests:
    description: Model calls per run (empty uses the config, default 12).
    required: false
    default: ''

outputs:
  verdict:
    description: pass or fail
    value: ${{ steps.gate.outputs.verdict }}
  blocking:
    description: Number of blocking findings
    value: ${{ steps.gate.outputs.blocking }}
  p0:
    description: Number of P0 findings
    value: ${{ steps.gate.outputs.p0 }}
  p1:
    description: Number of P1 findings
    value: ${{ steps.gate.outputs.p1 }}
  report:
    description: Path of report.md
    value: ${{ steps.gate.outputs.report }}
  affected-tests:
    description: Space-separated test files that reach the changed code (run these first)
    value: ${{ steps.gate.outputs.affected_tests }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install the gate
      shell: bash
      run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"

    # The model is optional. A failed install is a warning: the gate then runs on code-decided findings alone.
    - name: Install the Copilot CLI
      if: inputs.copilot-token != '' && (inputs.provider == 'auto' || inputs.provider == 'copilot')
      shell: bash
      env:
        COPILOT_VERSION: ${{ inputs.copilot-version }}
      run: npm install -g --no-audit --no-fund "@github/copilot@${COPILOT_VERSION}" || echo "::warning title=AI quality gate::The Copilot CLI could not be installed; running without a model."

    # Parsed files and model verdicts, keyed by content: a pull request re-reads only what it changed, and an
    # unchanged rule with unchanged tests is never sent to the model twice.
    - name: Restore the cache and the baseline
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/aqg-state
        key: aqg-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: aqg-${{ github.repository_id }}-

    - name: Review
      id: gate
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token }}
        AQG_PROVIDER: ${{ inputs.provider }}
        AQG_MODEL: ${{ inputs.model }}
        AQG_CONFIG: ${{ inputs.config }}
        AQG_FAIL_ON: ${{ inputs.fail-on }}
        AQG_MAX_REQUESTS: ${{ inputs.max-requests }}
        AQG_NEW_ONLY: ${{ inputs.new-only }}
        AQG_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        AQG_NAME: ${{ github.repository }}
        AQG_IS_DEFAULT: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        AQG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        AQG_STATE: ${{ runner.temp }}/aqg-state
        AQG_OUT: ${{ runner.temp }}/aqg
      run: |
        mkdir -p "$AQG_STATE"
        args=(run --repo "$GITHUB_WORKSPACE" --name "$AQG_NAME" --sha "${AQG_SHA:0:7}" --out "$AQG_OUT"
              --cache "$AQG_STATE/cache" --baseline "$AQG_STATE/baseline.json" --report-url "$AQG_URL" --provider "$AQG_PROVIDER")
        [ -f "$GITHUB_WORKSPACE/$AQG_CONFIG" ] && args+=(--config "$GITHUB_WORKSPACE/$AQG_CONFIG")
        [ -n "$AQG_MODEL" ] && args+=(--model "$AQG_MODEL")
        [ -n "$AQG_FAIL_ON" ] && args+=(--fail-on "$AQG_FAIL_ON")
        [ -n "$AQG_MAX_REQUESTS" ] && args+=(--max-requests "$AQG_MAX_REQUESTS")
        [ "$AQG_NEW_ONLY" = true ] && args+=(--new-only)
        # the default branch writes the baseline the ratchet compares with
        [ "$AQG_IS_DEFAULT" = true ] && args+=(--write-baseline)
        node "$GITHUB_ACTION_PATH/bin/aqg.js" "${args[@]}"

    - name: Job summary
      if: always() && steps.gate.outputs.verdict != ''
      shell: bash
      run: cat "$RUNNER_TEMP/aqg/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Save the cache and the baseline
      if: always() && steps.gate.outputs.verdict != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/aqg-state
        key: aqg-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Pull-request comment
      if: always() && steps.gate.outputs.verdict != '' && inputs.comment == 'true' && github.event_name == 'pull_request'
      continue-on-error: true   # a pull request from a fork has a read-only token; the job summary still has the report
      uses: actions/github-script@v7
      env:
        COMMENT_PATH: ${{ runner.temp }}/aqg/comment.md
      with:
        script: |
          const body = require('fs').readFileSync(process.env.COMMENT_PATH, 'utf8');
          const marker = '<!-- ai-quality-gate -->';
          const { owner, repo } = context.repo, issue_number = context.issue.number;
          const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = all.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - name: Code scanning
      if: always() && steps.gate.outputs.verdict != '' && inputs.sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/aqg/results.sarif
        category: ai-quality-gate

    - name: Upload the report
      if: always() && steps.gate.outputs.verdict != ''
      uses: actions/upload-artifact@v4
      with:
        name: ai-quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/aqg
        retention-days: 30

    - name: Enforce
      if: inputs.enforce == 'true' && steps.gate.outputs.verdict == 'fail'
      shell: bash
      env:
        BLOCKING: ${{ steps.gate.outputs.blocking }}
      run: |
        echo "::error title=AI quality gate::$BLOCKING blocking finding(s). See the job summary; fix-brief.md in the report artifact lists what to do."
        exit 1
