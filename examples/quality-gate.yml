# Copy to .github/workflows/quality-gate.yml.
# Every run reviews the whole repository. It runs on pull requests (so a gap is seen before the merge), on the default
# branch (which also writes the baseline for the ratchet), weekly, and by hand.
name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write       # the gate's single, updated comment
  # security-events: write   # only with sarif: 'true'

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Mira190/ai-quality-gate@v1
        with:
          # A fine-grained personal access token with the "Copilot Requests" permission.
          # Leave the secret unset to run on code-decided findings alone.
          copilot-token: ${{ secrets.COPILOT_PAT }}
          # A repository that starts with debt: report everything, block only what is not in the baseline yet.
          new-only: 'true'
          # Rollout: 'false' for the first weeks (report only), then 'true'.
          enforce: 'false'
